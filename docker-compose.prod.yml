x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:stable}
    pull_policy: ${APP_PULL_POLICY:-always}
    mem_limit: 768m
    restart: unless-stopped
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
    expose:
      - "3000"
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks:
      - internal

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/melgarafael/deskcomm-worker:stable}
    pull_policy: ${WORKER_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: Dockerfile.worker
    mem_limit: 512m
    restart: unless-stopped
    env_file: .env
    environment:
      WAHA_API_BASE_URL: http://waha:3000
      SUPABASE_DB_ADMIN_URL: ""
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8787/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks:
      - internal

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    mem_limit: 1280m
    restart: unless-stopped
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: "${WAHA_WEBHOOK_BASE_URL}/api/v1/webhooks/waha"
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks:
      - internal

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/melgarafael/deskcomm-scheduler:stable}
    pull_policy: ${SCHEDULER_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    logging: *default-logging
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data           # certificados Let's Encrypt (persistir!)
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

volumes:
  caddy-data:
  caddy-config:
  waha-data:
  waha-media:

networks:
  internal:
    driver: bridge
