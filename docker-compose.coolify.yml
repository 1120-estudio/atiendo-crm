# Coolify: imagenes compiladas y verificadas en GitHub Actions.
# Variables y secretos se configuran en Coolify.
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/1120-estudio/deskcommcrm@sha256:49cdd90b051e59eddc567649c50fd02299ca79e4ea32a1e486e95e3aea270224}
    pull_policy: always
    mem_limit: 768m
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
      WAHA_BYO_ENCRYPTION_KEY: ${WAHA_BYO_ENCRYPTION_KEY}
      AI_CRED_AES_KEY: ${AI_CRED_AES_KEY}
      IMPERSONATE_COOKIE_SECRET: ${IMPERSONATE_COOKIE_SECRET}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_HMAC_SECRET: ${WAHA_HMAC_SECRET}
      WAHA_GLOBAL_WEBHOOK_REQUIRE_SECRET: 'true'
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://1120salesagent.sagaia.cloud}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_APP_URL:-https://1120salesagent.sagaia.cloud}
      SUPABASE_DB_ADMIN_URL: ''
      WAHA_API_BASE_URL: http://waha:3000
      WAHA_WEBHOOK_BASE_URL: ${NEXT_PUBLIC_APP_URL:-https://1120salesagent.sagaia.cloud}
      UPSTASH_REDIS_REST_URL: http://srh:80
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
      APP_LOCALE: es
      APP_NAME: ${APP_NAME:-1120 Sales Agent}
      SENTRY_DSN: 'off'
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
    expose:
    - '3000'
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *id001
    networks:
    - internal
    - supabase
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/1120-estudio/deskcomm-worker@sha256:3679edbf4b7c74e74942fc12a5ceb27ddda3f1856146e455fe1dab8599bade30}
    pull_policy: always
    mem_limit: 512m
    restart: unless-stopped
    environment:
      INBOUND_DEBOUNCE_MS: ${INBOUND_DEBOUNCE_MS:-8000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
      WAHA_BYO_ENCRYPTION_KEY: ${WAHA_BYO_ENCRYPTION_KEY}
      AI_CRED_AES_KEY: ${AI_CRED_AES_KEY}
      IMPERSONATE_COOKIE_SECRET: ${IMPERSONATE_COOKIE_SECRET}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_HMAC_SECRET: ${WAHA_HMAC_SECRET}
      WAHA_GLOBAL_WEBHOOK_REQUIRE_SECRET: 'true'
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://1120salesagent.sagaia.cloud}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_APP_URL:-https://1120salesagent.sagaia.cloud}
      SUPABASE_DB_ADMIN_URL: ''
      WAHA_API_BASE_URL: http://waha:3000
      WAHA_WEBHOOK_BASE_URL: ${NEXT_PUBLIC_APP_URL:-https://1120salesagent.sagaia.cloud}
      UPSTASH_REDIS_REST_URL: http://srh:80
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
      APP_LOCALE: es
      APP_NAME: ${APP_NAME:-1120 Sales Agent}
      SENTRY_DSN: 'off'
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://127.0.0.1:8787/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *id001
    networks:
    - internal
    - supabase
    depends_on:
      app:
        condition: service_healthy
      srh:
        condition: service_started
      waha:
        condition: service_started
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    mem_limit: 1280m
    restart: unless-stopped
    environment:
      WAHA_API_KEY: sha512:${WAHA_API_KEY_SHA512}
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message.any,message.ack,message.edited,message.revoked,session.status,state.change
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HMAC_SECRET}
      WHATSAPP_HOOK_CUSTOM_HEADERS: "X-Waha-Webhook-Secret:${WAHA_HMAC_SECRET}"
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: 'false'
      WHATSAPP_RESTART_ALL_SESSIONS: ${WHATSAPP_RESTART_ALL_SESSIONS:-True}
    volumes:
    - waha-data:/app/.sessions
    - waha-media:/app/.media
    logging: *id001
    networks:
    - internal
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *id001
    networks:
    - internal
    mem_limit: 128m
  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *id001
    networks:
    - internal
    mem_limit: 128m
  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/1120-estudio/deskcomm-scheduler@sha256:1fa3cdcd8e0e8fdae97995a59bdb475447d894b5b6936b14ac4904512f4d701b}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    logging: *id001
    networks:
    - internal
    mem_limit: 96m
volumes:
  waha-data: null
  waha-media: null
networks:
  internal:
    driver: bridge
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-pslkgetwjyaalqwbv0eueqem}
